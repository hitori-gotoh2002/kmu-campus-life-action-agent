name: Telegram Callback Processor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-callbacks
  cancel-in-progress: false

jobs:
  callbacks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: Asia/Seoul
      DEMO_MODE: "false"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_CALENDAR_DB_ID: ${{ secrets.NOTION_CALENDAR_DB_ID }}
      NOTION_PORTFOLIO_PAGE_ID: ${{ secrets.NOTION_PORTFOLIO_PAGE_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore recommendation history
        uses: actions/cache/restore@v4
        with:
          path: data/agent.db
          key: kmu-agent-db-callback-${{ github.run_id }}
          restore-keys: |
            kmu-agent-db-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Poll Telegram callbacks
        id: poll
        shell: bash
        run: |
          python - <<'PY'
          import os
          from modules import telegram_callbacks

          result = telegram_callbacks.poll_once(timeout=0)
          print(result)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"handled={int(result.get('handled') or 0)}\n")
              f.write(f"updates={int(result.get('updates') or 0)}\n")
          PY

      - name: Save recommendation history
        if: steps.poll.outputs.handled != '0'
        uses: actions/cache/save@v4
        with:
          path: data/agent.db
          key: kmu-agent-db-callback-${{ github.run_id }}
