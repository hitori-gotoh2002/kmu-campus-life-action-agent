name: Daily KMU Digest

on:
  schedule:
    # 08:00 Asia/Seoul = 23:00 UTC on the previous day.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-kmu-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: Asia/Seoul
      DEMO_MODE: "false"
      DELIVERY_MODE: digest
      STORE_BACKEND: supabase
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-4o-mini
      SOURCE_FOCUS_FILTER: "true"
      MAX_DETAIL_PER_SOURCE: "8"
      LINKAREER_PAGE_SIZE: "24"
      # Leave these empty to respect Supabase/web settings.
      # Set GitHub Variables with the same names only when a server-side override is needed.
      DIGEST_CATEGORIES: ${{ vars.DIGEST_CATEGORIES }}
      TELEGRAM_CATEGORIES: ${{ vars.TELEGRAM_CATEGORIES }}
      DIGEST_WEEKLY_DAY: "월"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_CALENDAR_DB_ID: ${{ secrets.NOTION_CALENDAR_DB_ID }}
      NOTION_PORTFOLIO_PAGE_ID: ${{ secrets.NOTION_PORTFOLIO_PAGE_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run daily digest
        run: python main.py
